[package]
name = "lean-audit"
version = "0.8.0"
edition = "2021"
authors = ["Alexander Limanskii"]
description = "Fast DAG deduplicator, arXiv-style LaTeX proof outline generator, and mutation testing CLI for Lean 4"
license = "MIT"
readme = "README.md"
repository = "https://github.com"
keywords = ["lean", "lean4", "formal-verification", "mutation-testing", "theorem-proving"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "lean-audit"
path = "src/main.rs"

[[bin]]
name = "laud"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
indicatif = "0.17"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
