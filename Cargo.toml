[package]
name = "lean-audit"
version = "0.1.0"
edition = "2021"
description = "Fast DAG deduplicator and mutation auditor for large Lean 4 formalizations"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[[bin]]
name = "lean-audit"
path = "src/main.rs"

[[bin]]
name = "laud"
path = "src/main.rs"
